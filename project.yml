name: LyricIsland
options:
  bundleIdPrefix: com.lyricisland
  developmentLanguage: zh-Hant
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: NO
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  LyricIsland:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LyricIsland
        excludes:
          - Info.plist
      - path: Shared
    dependencies:
      - target: LyricIslandWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lyricisland.app
        INFOPLIST_FILE: LyricIsland/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES

  LyricIslandWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LyricIslandWidget
        excludes:
          - Info.plist
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lyricisland.app.widget
        INFOPLIST_FILE: LyricIslandWidget/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
